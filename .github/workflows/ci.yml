name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore ./MeetingRoomBooking.sln

      - name: Build backend
        run: >
          dotnet build
          ./MeetingRoomBooking.sln
          --configuration Release
          --no-restore

      - name: Restore portable database tool
        run: dotnet restore ./tools/RoomBooking.DatabaseTool/RoomBooking.DatabaseTool.csproj

      - name: Build database portability tool
        run: dotnet build ./tools/RoomBooking.DatabaseTool/RoomBooking.DatabaseTool.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: >
          dotnet test
          ./MeetingRoomBooking.sln
          --configuration Release
          --no-build

  claude-standards:
    name: Claude standards installer smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test safe global instructions installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP ('claude-test-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $target = Join-Path $folder 'CLAUDE.md'
          Set-Content -LiteralPath $target -Value 'Keep my existing personal instruction.' -NoNewline

          ./scripts/Install-ClaudeUserStandards.ps1 -TargetFile $target -Preview
          if ([System.IO.File]::ReadAllText($target) -ne 'Keep my existing personal instruction.') {
            throw 'Preview modified the existing instructions.'
          }

          ./scripts/Install-ClaudeUserStandards.ps1 -TargetFile $target
          $first = [System.IO.File]::ReadAllText($target)
          if (-not $first.Contains('Keep my existing personal instruction.') -or
              -not $first.Contains('Shared engineering standards (all projects)')) {
            throw 'The installer did not preserve existing instructions and add the shared rules.'
          }

          ./scripts/Install-ClaudeUserStandards.ps1 -TargetFile $target
          $second = [System.IO.File]::ReadAllText($target)
          if ($first -cne $second) {
            throw 'The installer is not idempotent.'
          }

          $backups = @(Get-ChildItem -LiteralPath $folder -Filter 'CLAUDE.md.backup.*')
          if ($backups.Count -ne 1) {
            throw 'Expected exactly one backup of existing instructions.'
          }

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/meeting-room-booking-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./src/meeting-room-booking-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test -- --watch=false

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore backend dependencies
        run: dotnet restore ./MeetingRoomBooking.sln

      - name: Build backend
        run: >
          dotnet build
          ./MeetingRoomBooking.sln
          --configuration Release
          --no-restore

      - name: Restore portable database tool
        run: dotnet restore ./tools/RoomBooking.DatabaseTool/RoomBooking.DatabaseTool.csproj

      - name: Build database portability tool
        run: dotnet build ./tools/RoomBooking.DatabaseTool/RoomBooking.DatabaseTool.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: >
          dotnet test
          ./MeetingRoomBooking.sln
          --configuration Release
          --no-build

      # The credential-free demo from the README: fresh demo database,
      # synthetic bookings through the API, then stop (PowerShell 7 on Linux).
      - name: Demo script smoke test
        shell: pwsh
        run: ./scripts/Start-Demo.ps1 -Reset -StopAfterSeed

      # The README's bash variant of the demo, exactly as written there.
      - name: Documented bash demo command
        shell: bash
        run: |
          rm -rf .demo
          mkdir -p .demo
          ConnectionStrings__BookingDatabase="Data Source=$PWD/.demo/room-booking-demo.db" \
          LegacyApi__AllowAnonymous=true ASPNETCORE_ENVIRONMENT=Development \
          dotnet run --project src/MeetingRoomBooking.Api --no-launch-profile -- --urls http://localhost:5003 > api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5003/health > /dev/null; then break; fi
            sleep 2
          done
          rooms=$(curl -fsS http://localhost:5003/api/rooms | grep -o '"id"' | wc -l)
          echo "Rooms in the demo database: $rooms"
          pkill -f MeetingRoomBooking.Api || true
          if [ "$rooms" -ne 3 ]; then cat api.log; exit 1; fi

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/meeting-room-booking-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./src/meeting-room-booking-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test -- --watch=false
